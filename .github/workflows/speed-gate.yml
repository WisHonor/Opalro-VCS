name: Speed gate

# Throwaway, on a gate/ branch only: who on Git's own history with Opalro's rule at a combine and
# with Git's (OPALRO_WHO_RULE=git), timed in turns on one runner.
on:
  push:
    branches: ["gate/**"]

permissions:
  contents: read

jobs:
  who-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GIT_SOURCE: 7fb6055e678f800320d8ab8cd8f201d9493d1ba0
      OPALRO_USER_NAME: Bench
      OPALRO_USER_EMAIL: bench@example.com
    steps:
      - name: Settings folder
        run: |
          echo "OPALRO_CONFIG_DIR=$RUNNER_TEMP/config" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/config"
      - name: Describe the machine
        run: |
          echo "$ImageOS $ImageVersion"
          lscpu | grep -E '^(Model name|CPU\(s\)):'
          free -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build opalro
        run: |
          cargo build --release -p opal-vcs
          echo "opalro at $GITHUB_SHA"
      - name: Clone git/git with its whole history, master at the Nightly's commit
        run: |
          git clone --quiet --no-checkout https://github.com/git/git "$RUNNER_TEMP/git"
          cd "$RUNNER_TEMP/git"
          git --version
          git update-ref refs/heads/master "$GIT_SOURCE"
          echo "master is $(git rev-parse master)"
          git commit-graph write --reachable
      - name: Import it
        run: |
          cd "$RUNNER_TEMP/git"
          /usr/bin/time -f "import: %e s, peak %M KiB" "$GITHUB_WORKSPACE/target/release/opalro" import
      - name: who with each rule, in turns
        run: |
          cd "$RUNNER_TEMP/git"
          python3 "$GITHUB_WORKSPACE/.github/workflows/who-rule.py" \
            "$GITHUB_WORKSPACE/target/release/opalro" master 9 \
            Makefile diff.c git-compat-util.h README.md t/t8002-blame.sh
