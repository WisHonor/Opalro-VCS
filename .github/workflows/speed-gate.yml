name: Speed gate

# A throwaway measurement, on the branch gate/m10-timers only, never merged: a build with timers
# in it shows what each part of `opalro status` and `opalro goto` costs (decision 186, point 1).
on:
  push:
    branches: ["gate/**"]

permissions:
  contents: read

jobs:
  timers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      OPALRO_USER_NAME: Bench
      OPALRO_USER_EMAIL: bench@example.com
    steps:
      - name: Describe the machine
        run: |
          echo "$ImageOS $ImageVersion"
          if [ "$RUNNER_OS" = Linux ]; then
            lscpu | grep -E '^(Model name|CPU\(s\)):'; free -h; df -h "$RUNNER_TEMP"
          else
            powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors; Get-MpComputerStatus | Format-List RealTimeProtectionEnabled" || true
          fi
          echo "OPALRO_CONFIG_DIR=$RUNNER_TEMP/config" >>"$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install hyperfine
        run: cargo install --locked hyperfine --version 1.20.0
      - name: Build, with the timers
        run: |
          cargo build --release -p opal-vcs
          git log -1 --format='Measured: %H %s'
      - name: status and goto, timed from the inside
        run: |
          bin=target/release/opalro
          [ "$RUNNER_OS" = Windows ] && bin=$bin.exe
          tmp=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          bash bench/timers.sh "$bin" "$tmp/work" 15
