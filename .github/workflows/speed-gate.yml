name: Speed gate

# A throwaway look, on a gate/ branch only: where who and git blame name different commits on
# Git's own history, whether who's answer is a right one.
on:
  push:
    branches: ["gate/**"]

permissions:
  contents: read

jobs:
  who-against-blame:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      GIT_SOURCE: 7fb6055e678f800320d8ab8cd8f201d9493d1ba0
      ROUND: "2"
    steps:
      - name: Settings folder
        run: echo "OPALRO_CONFIG_DIR=$RUNNER_TEMP/config" >>"$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clone git/git with its whole history, master at the Nightly's commit
        run: |
          git clone --quiet --no-checkout https://github.com/git/git "$RUNNER_TEMP/git"
          cd "$RUNNER_TEMP/git"
          git --version
          echo "master was $(git rev-parse master)"
          git update-ref refs/heads/master "$GIT_SOURCE"
          echo "master is $(git rev-parse master)"
          git commit-graph write --reachable
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/out" "$OPALRO_CONFIG_DIR"
          cp -a .git "$RUNNER_TEMP/work/.git"
      - name: A closer look at the merges and moved lines
        run: python3 whodiff/extra.py "$RUNNER_TEMP/git" "$GIT_SOURCE" | tee "$RUNNER_TEMP/out/extra.txt"
      - name: Import it and run who
        if: env.ROUND != '2'
        env:
          WHODIFF_WORK: ${{ runner.temp }}/work
          WHODIFF_OUT: ${{ runner.temp }}/out/who.tsv
        run: |
          cargo test --release -p opal-vcs --test whodiff -- --ignored --nocapture --exact who_lines_of_a_real_repository 2>&1 | tee "$RUNNER_TEMP/out/import.txt"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/out/import.txt"
      - name: Check the answers against Git
        if: env.ROUND != '2'
        run: python3 whodiff/analyze.py "$RUNNER_TEMP/git" "$GIT_SOURCE" "$RUNNER_TEMP/out/who.tsv" "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: whodiff
          path: ${{ runner.temp }}/out/
