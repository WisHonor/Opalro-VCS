name: Speed gate

# A throwaway measurement, on a gate/ branch only: the timed amend in a project of 300 old lines,
# in a release build, on milestone 10's code.
on:
  push:
    branches: ["gate/**"]

permissions:
  contents: read

jobs:
  the-timed-amend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Describe the machine
        run: |
          echo "$ImageOS $ImageVersion"
          if [ "$RUNNER_OS" = Linux ]; then lscpu | grep -E '^(Model name|CPU\(s\)):'; free -h; else wmic cpu get name || true; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 7576db03001afae5f4e95732bf87d91ecdfa9905
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The timed amend, in a release build
        run: cargo test --release -p opal-vcs --all-features --test redteam13 amend_in_a_project_of_300_old_lines_timed -- --ignored --nocapture
